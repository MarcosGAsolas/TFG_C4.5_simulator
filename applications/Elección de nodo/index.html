<!DOCTYPE html>
<html lang="es">

<head>
    <script src="../lib/jquery-3.7.1.min.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elección de nodo</title>
</head>

<body>
    <header class="py-3 mb-4 border-bottom bg-body-secondary bg-opacity-75">
        <div class="d-flex align-items-center gap-2 px-2">
            <a href="https://www.ubu.es" class="d-flex align-items-center me-2">
                <img src="/img/ubulogocolorfull.png" width="100" height="50" alt="Universidad de Burgos">
            </a>
            <a href="../index.html" class="fw-bold fs-5 ms-2 me-2 nav-link link-dark">Simulador árbol de decisión (Algoritmo C4.5)</a>
            <div class="d-flex flex-row align-items-center gap-2 ms-auto">
                <a href="../index.html" class="step-btn text-decoration-none">Menú</a>
                <a href="../entropia/index.html" class="step-btn text-decoration-none">Entropía</a>
                <span class="step-btn active-step">Elección de nodo</span>
                <span class="step-btn" aria-disabled="true" title="Sección no disponible">Árbol de decisión C4.5</span>
            </div>
        </div>
    </header>

    <main class="container pb-2">
        <div class="row justify-content-center gy-3 pt-2 pb-3">
            <div class="col-12 d-flex flex-wrap justify-content-center gap-4 mb-3" aria-label="Controles de pasos">
                <button id="btnPasoUmbral" class="step-btn active-step">Umbral</button>
                <button id="btnPasoGanancia" class="step-btn">Ganancia de información</button>
                <button id="btnPasoSplitInfo" class="step-btn">Split Info</button>
                <button id="btnPasoGainRatio" class="step-btn">Gain Ratio</button>
                <button id="btnPasoNodo" class="step-btn">Nodo elegido</button>
            </div>

            <div class="col-12 text-center">
                <h2 id="stepTitle" class="h4"></h2>
            </div>
        </div>

        <div class="row-auto p-2 pb-4 step-info-row">
            <div class="step-info-column">
                <div id="infoCardContainer" class="mt-3"></div>
                <div id="formulaUmbral" class="mt-3"></div>
            </div>
        </div>

        <div class="row justify-content-center gy-3 pb-3 step-layout-row">
            <div class="col-lg-6 step-data-column">
                <div id="stepTableContainer"></div>
            </div>

            <div class="col-lg-6 step-results-column">
                <div id="stepExtraContainer" class="mt-3"></div>
            </div>
        </div>
    </main>

    <footer class="py-3 mt-2 border-top bg-dark text-white">
        <div class="container d-flex flex-wrap justify-content-between align-items-center">
            <div class="col-md-4 col-auto d-flex align-items-center">
                <ul class="flex-column">
                    <span class="fw-bold">Autores:</span>
                    <li class="mb-2 mt-2" style="list-style-type: none;">
                        <span>Marcos Guzmán Asolas</span>
                    </li>
                    <li class="mb-2" style="list-style-type: none;">
                        <span>Carlos López Nozal</span>
                    </li>
                    <li class="mb-2" style="list-style-type: none;">
                        <span>Gadea Lucas Pérez</span>
                    </li>
                </ul>
            </div>
            <div class="col-md-3 col-auto d-flex align-items-center">
                <span class="date fw-light"></span>
                <script>
                    fetch("https://api.github.com/repos/MarcosGAsolas/TFG_C4.5_simulator")
                        .then(res => res.json())
                        .then(repo => {
                            let d = new Date(repo.updated_at);
                            document.querySelector(".date").textContent =
                                `Última actualización: ${d.getDate()}-${d.getMonth() + 1}-${d.getFullYear()}`;
                        });
                </script>
            </div>
        </div>
    </footer>

    <script type="module">
        import { goToSpecificStep } from './js/stepbystep.js';

        document.querySelector('#btnPasoUmbral').addEventListener('click', () => goToSpecificStep(0));
        document.querySelector('#btnPasoGanancia').addEventListener('click', () => goToSpecificStep(1));
        document.querySelector('#btnPasoSplitInfo').addEventListener('click', () => goToSpecificStep(2));
        document.querySelector('#btnPasoGainRatio').addEventListener('click', () => goToSpecificStep(3));
        document.querySelector('#btnPasoNodo').addEventListener('click', () => goToSpecificStep(4));

        goToSpecificStep(0);
    </script>
</body>

</html>
